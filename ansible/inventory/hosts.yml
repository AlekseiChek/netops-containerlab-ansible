---
# Targets the live containerlab Stage-1 FRR nodes via docker exec (no SSH).
all:
  vars:
    ansible_connection: community.docker.docker   # docker exec, not SSH
    isis_process: CORE
  children:
    core:                # IS-IS + iBGP nodes — drain applies here
      hosts:
        rr1: { ansible_host: clab-stage1-rr1 }
        p1:  { ansible_host: clab-stage1-p1 }
        p2:  { ansible_host: clab-stage1-p2 }
        pe1: { ansible_host: clab-stage1-pe1 }
        pe2: { ansible_host: clab-stage1-pe2 }
    ce:                  # eBGP customer edge — no IS-IS, no drain
      hosts:
        ce1: { ansible_host: clab-stage1-ce1 }
        ce2: { ansible_host: clab-stage1-ce2 }
