---
# The "change". Demo = push a benign blackhole static route (observable,
# reversible, harmless). In production this is the rendered config push
# (Ansible junos_config / NAPALM replace) — same role slot.

- name: "Deploy change — add blackhole route {{ deploy_route }}"
  ansible.builtin.command: >
    vtysh -c "configure terminal"
          -c "ip route {{ deploy_route }} blackhole"
          -c "end"
          -c "write memory"
  changed_when: true

- name: Record deploy timestamp
  ansible.builtin.set_fact:
    deploy_ts: "{{ '%Y-%m-%dT%H:%M:%S' | strftime }}"
