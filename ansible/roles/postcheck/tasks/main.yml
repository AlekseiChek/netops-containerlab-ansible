---
# Deterministic health gate: re-read state, compare vs precheck baseline.
# A failed assert stops the play (any_errors_fatal) => the change is blocked.

- name: Wait for reconvergence
  ansible.builtin.pause: { seconds: "{{ convergence_wait }}" }

- name: Get IS-IS neighbors (post)
  ansible.builtin.command: vtysh -c "show isis neighbor"
  register: isis_post
  changed_when: false

- name: Get iBGP summary (post)
  ansible.builtin.command: vtysh -c "show bgp ipv4 unicast summary"
  register: bgp_post
  changed_when: false

- name: Verify the change landed (blackhole route present)
  ansible.builtin.command: vtysh -c "show ip route {{ deploy_route }}"
  register: route_check
  changed_when: false

- name: GATE — IS-IS adjacency still Up
  ansible.builtin.assert:
    that: "'Up' in isis_post.stdout"
    fail_msg: "{{ inventory_hostname }}: IS-IS adjacency lost post-deploy — ROLLBACK"

- name: GATE — BGP did not degrade (down-peers not increased)
  ansible.builtin.assert:
    that: "(bgp_post.stdout | regex_findall('Active|Idle|Connect') | length) <= (pre_bgp_down | int)"
    fail_msg: "{{ inventory_hostname }}: BGP peers degraded post-deploy — ROLLBACK"

- name: GATE — change is actually present
  ansible.builtin.assert:
    that: "'blackhole' in route_check.stdout or 'Null' in route_check.stdout"
    fail_msg: "{{ inventory_hostname }}: deployed route missing — change did not apply"
    success_msg: "{{ inventory_hostname }}: health gate PASS"

- name: Write postcheck/diff report
  ansible.builtin.template:
    src: diff_report.j2
    dest: "{{ artifacts_dir }}/postcheck_{{ inventory_hostname }}.txt"
  delegate_to: localhost
