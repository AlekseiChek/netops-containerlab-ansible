---
# Snapshot live state BEFORE the change — baseline for postcheck + evidence.

- name: Ensure artifacts dir exists
  ansible.builtin.file: { path: "{{ artifacts_dir }}", state: directory }
  delegate_to: localhost
  run_once: true

- name: Get IS-IS neighbors
  ansible.builtin.command: vtysh -c "show isis neighbor"
  register: isis_pre
  changed_when: false

- name: Get iBGP summary
  ansible.builtin.command: vtysh -c "show bgp ipv4 unicast summary"
  register: bgp_pre
  changed_when: false

- name: Get route table summary
  ansible.builtin.command: vtysh -c "show ip route summary"
  register: route_pre
  changed_when: false

- name: Assert IS-IS has at least one Up adjacency
  ansible.builtin.assert:
    that: "'Up' in isis_pre.stdout"
    fail_msg: "{{ inventory_hostname }}: no IS-IS adjacency Up — risky to deploy"
    success_msg: "{{ inventory_hostname }}: IS-IS OK pre-deploy"

- name: Record baseline BGP down-peer count (Active/Idle/Connect)
  ansible.builtin.set_fact:
    pre_bgp_down: "{{ bgp_pre.stdout | regex_findall('Active|Idle|Connect') | length }}"

- name: Save precheck snapshot
  ansible.builtin.copy:
    dest: "{{ artifacts_dir }}/precheck_{{ inventory_hostname }}.txt"
    content: |
      === PRECHECK {{ inventory_hostname }} ===
      --- IS-IS neighbor ---
      {{ isis_pre.stdout }}
      --- BGP summary ---
      {{ bgp_pre.stdout }}
      --- route summary ---
      {{ route_pre.stdout }}
  delegate_to: localhost
