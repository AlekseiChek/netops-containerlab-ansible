frr defaults traditional
hostname p2
!
interface lo
 ip address 192.0.2.12/32
 ip router isis CORE
 isis passive
!
interface eth1
 ip address 10.0.0.1/31
 ip router isis CORE
 isis network point-to-point
!
interface eth2
 ip address 10.0.0.4/31
 ip router isis CORE
 isis network point-to-point
!
interface eth3
 ip address 10.0.0.9/31
 ip router isis CORE
 isis network point-to-point
!
router isis CORE
 is-type level-2-only
 net 49.0001.1920.0000.2012.00
!
router bgp 65000
 bgp router-id 192.0.2.12
 neighbor 192.0.2.101 remote-as 65000
 neighbor 192.0.2.101 update-source lo
 address-family ipv4 unicast
  neighbor 192.0.2.101 activate
 exit-address-family
!
