name: stage1
# Redundant 2-site SP fabric (Full-FRR):
#   site-A: ce1 dual-homed to pe1+pe2   |   site-B: ce2 dual-homed to pe3+pe4
#   core: p1/p2 (IS-IS L2) + 2 route reflectors rr1/rr2 (iBGP, redundant).
#   All PEs and RRs are dual-attached to BOTH p1 and p2.  10 nodes, 17 links.
topology:
  defaults:
    kind: linux
    image: frrouting/frr:latest
  nodes:
    rr1: { binds: ["configs/rr1/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: rr, location: core} }
    rr2: { binds: ["configs/rr2/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: rr, location: core} }
    p1:  { binds: ["configs/p1/frr.conf:/etc/frr/frr.conf",  "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: p,  location: core} }
    p2:  { binds: ["configs/p2/frr.conf:/etc/frr/frr.conf",  "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: p,  location: core} }
    pe1: { binds: ["configs/pe1/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: pe, location: site-a} }
    pe2: { binds: ["configs/pe2/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: pe, location: site-a} }
    pe3: { binds: ["configs/pe3/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: pe, location: site-b} }
    pe4: { binds: ["configs/pe4/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: pe, location: site-b} }
    ce1: { binds: ["configs/ce1/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: ce, location: site-a} }
    ce2: { binds: ["configs/ce2/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: ce, location: site-b} }
  links:
    # core
    - endpoints: ["p1:eth1",  "p2:eth1"]    # 10.0.0.0/31
    # site-A PEs dual-attached to core
    - endpoints: ["pe1:eth1", "p1:eth2"]    # 10.0.0.2/31
    - endpoints: ["pe1:eth2", "p2:eth2"]    # 10.0.0.4/31
    - endpoints: ["pe2:eth1", "p1:eth3"]    # 10.0.0.6/31
    - endpoints: ["pe2:eth2", "p2:eth3"]    # 10.0.0.8/31
    # site-B PEs dual-attached to core
    - endpoints: ["pe3:eth1", "p1:eth4"]    # 10.0.0.10/31
    - endpoints: ["pe3:eth2", "p2:eth4"]    # 10.0.0.12/31
    - endpoints: ["pe4:eth1", "p1:eth5"]    # 10.0.0.14/31
    - endpoints: ["pe4:eth2", "p2:eth5"]    # 10.0.0.16/31
    # RRs dual-attached to core
    - endpoints: ["rr1:eth1", "p1:eth6"]    # 10.0.0.18/31
    - endpoints: ["rr1:eth2", "p2:eth6"]    # 10.0.0.20/31
    - endpoints: ["rr2:eth1", "p1:eth7"]    # 10.0.0.22/31
    - endpoints: ["rr2:eth2", "p2:eth7"]    # 10.0.0.24/31
    # site-A customer (ce1 dual-homed to pe1+pe2)
    - endpoints: ["ce1:eth1", "pe1:eth3"]   # 10.1.1.0/31
    - endpoints: ["ce1:eth2", "pe2:eth3"]   # 10.1.1.2/31
    # site-B customer (ce2 dual-homed to pe3+pe4)
    - endpoints: ["ce2:eth1", "pe3:eth3"]   # 10.1.2.0/31
    - endpoints: ["ce2:eth2", "pe4:eth3"]   # 10.1.2.2/31
