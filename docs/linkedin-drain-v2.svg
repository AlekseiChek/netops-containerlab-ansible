<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1D20"/><stop offset="1" stop-color="#121417"/></linearGradient>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5FB0B7"/></marker>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .h  { font-family:'Bahnschrift','DIN',sans-serif; font-weight:700; }
      .hl { font-family:'Bahnschrift','DIN',sans-serif; font-weight:300; }
      .m  { font-family:'Cascadia Code','Consolas',monospace; }
    </style>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <!-- left copper spine -->
  <rect x="0" y="0" width="10" height="1200" fill="#E08A3C"/>

  <!-- monogram mark (top-left) -->
  <g transform="translate(70,78)">
    <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="none" stroke="#E08A3C" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" class="h" font-size="24" fill="#EDEAE3" letter-spacing="1">AC</text>
  </g>
  <text x="108" y="66" class="m" font-size="15" fill="#5FB0B7" letter-spacing="3">NETOPS · SRE</text>
  <text x="108" y="90" class="m" font-size="13" fill="#7d8590" letter-spacing="2">FIELD NOTES /// no.01</text>

  <!-- headline -->
  <text x="64" y="190" class="h" font-size="78" fill="#E08A3C" letter-spacing="1">MAKE-BEFORE-</text>
  <text x="64" y="262" class="h" font-size="78" fill="#E08A3C" letter-spacing="1">BREAK</text>
  <text x="68" y="312" class="hl" font-size="34" fill="#C7CDD4" letter-spacing="2">Drain the node — then reboot.</text>

  <!-- INTERNET geometric cloud -->
  <g transform="translate(450,415)">
    <path d="M-95,18 a30,30 0 0,1 8,-58 a40,40 0 0,1 74,-18 a34,34 0 0,1 58,16 a28,28 0 0,1 6,60 Z"
          fill="#0E1012" stroke="#5FB0B7" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" class="h" font-size="26" fill="#EDEAE3" letter-spacing="2">INTERNET</text>
  </g>

  <!-- links cloud->PE -->
  <line x1="378" y1="452" x2="250" y2="612" stroke="#E08A3C" stroke-width="4" stroke-dasharray="9 8"/>
  <line x1="522" y1="452" x2="650" y2="612" stroke="#5FB0B7" stroke-width="7" filter="url(#glow)"/>

  <!-- PE1 hexagon DRAINING (copper) -->
  <g transform="translate(235,672)" text-anchor="middle">
    <polygon points="-72,0 -36,-62 36,-62 72,0 36,62 -36,62" fill="#0E1012" stroke="#E08A3C" stroke-width="4"/>
    <text x="0" y="-6" class="h" font-size="30" fill="#E08A3C" letter-spacing="1">PE1</text>
    <text x="0" y="24" class="m" font-size="15" fill="#E08A3C" letter-spacing="2">DRAINING</text>
  </g>
  <text x="235" y="585" text-anchor="middle" class="m" font-size="14" fill="#E08A3C" letter-spacing="1">overload-bit + graceful-shutdown</text>

  <!-- PE2 hexagon CARRYING (teal) -->
  <g transform="translate(665,672)" text-anchor="middle">
    <polygon points="-72,0 -36,-62 36,-62 72,0 36,62 -36,62" fill="#0E1012" stroke="#5FB0B7" stroke-width="4"/>
    <text x="0" y="-6" class="h" font-size="30" fill="#5FB0B7" letter-spacing="1">PE2</text>
    <text x="0" y="24" class="m" font-size="15" fill="#5FB0B7" letter-spacing="2">CARRYING</text>
  </g>
  <text x="665" y="585" text-anchor="middle" class="m" font-size="14" fill="#5FB0B7" letter-spacing="1">redundant path = zero impact</text>

  <!-- PE->CE -->
  <line x1="235" y1="734" x2="300" y2="905" stroke="#E08A3C" stroke-width="4" stroke-dasharray="9 8"/>
  <line x1="320" y1="720" x2="600" y2="905" stroke="#E08A3C" stroke-width="3" stroke-dasharray="5 8" opacity="0.4"/>
  <line x1="665" y1="734" x2="612" y2="905" stroke="#5FB0B7" stroke-width="7" marker-end="url(#tip)" filter="url(#glow)"/>
  <line x1="585" y1="720" x2="300" y2="905" stroke="#5FB0B7" stroke-width="7" marker-end="url(#tip)" filter="url(#glow)"/>

  <!-- CE circles (customers) -->
  <g text-anchor="middle">
    <circle cx="285" cy="952" r="48" fill="#0E1012" stroke="#C7CDD4" stroke-width="3"/>
    <text x="285" y="960" class="h" font-size="24" fill="#EDEAE3">CE1</text>
    <circle cx="615" cy="952" r="48" fill="#0E1012" stroke="#C7CDD4" stroke-width="3"/>
    <text x="615" y="960" class="h" font-size="24" fill="#EDEAE3">CE2</text>
    <text x="450" y="1038" class="hl" font-size="22" fill="#9AA0A8" letter-spacing="1">customers — traffic never stops</text>
  </g>

  <!-- footer proof + wordmark -->
  <rect x="64" y="1078" width="772" height="92" rx="6" fill="#0E1012" stroke="#5FB0B7" stroke-width="1.5"/>
  <text x="86" y="1118" class="m" font-size="18" fill="#7d8590">ce1 → ce2  while PE1 reboots</text>
  <text x="86" y="1150" class="m" font-size="26" fill="#5FB0B7">0% packet loss — proven, not promised</text>
  <text x="820" y="1192" text-anchor="end" class="m" font-size="13" fill="#5a6068" letter-spacing="2">ALEKSEI CHEKHUN · netops.engineer</text>
</svg>
