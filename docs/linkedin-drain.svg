<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1d20"/><stop offset="1" stop-color="#15171A"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5FB0B7"/></marker>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <text x="60" y="105" fill="#5FB0B7" font-size="28" font-weight="700" letter-spacing="2">NETOPS / SRE</text>
  <text x="60" y="165" fill="#E08A3C" font-size="58" font-weight="800">Make-before-break</text>
  <text x="60" y="218" fill="#9aa0a8" font-size="31" font-weight="500">Drain the node. Then reboot.</text>
  <line x1="60" y1="250" x2="840" y2="250" stroke="#33363b" stroke-width="2"/>
  <g transform="translate(450,360)">
    <g fill="#0e1012" stroke="#5FB0B7" stroke-width="3">
      <ellipse cx="-70" cy="10" rx="55" ry="40"/><ellipse cx="70" cy="10" rx="55" ry="40"/>
      <ellipse cx="-20" cy="-25" rx="55" ry="42"/><ellipse cx="45" cy="-20" rx="50" ry="40"/>
      <rect x="-110" y="0" width="220" height="42" rx="20"/>
    </g>
    <text x="0" y="20" text-anchor="middle" fill="#EDEAE3" font-size="30" font-weight="700">INTERNET</text>
  </g>
  <line x1="370" y1="405" x2="245" y2="600" stroke="#E08A3C" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="530" y1="405" x2="655" y2="600" stroke="#5FB0B7" stroke-width="7" filter="url(#glow)"/>
  <g text-anchor="middle">
    <rect x="150" y="600" width="170" height="100" rx="16" fill="#0e1012" stroke="#E08A3C" stroke-width="4"/>
    <text x="235" y="645" fill="#E08A3C" font-size="30" font-weight="800">PE1</text>
    <text x="235" y="678" fill="#E08A3C" font-size="20" font-weight="700">DRAINING</text>
    <text x="235" y="565" fill="#E08A3C" font-size="19" font-weight="600">overload-bit + graceful-shutdown</text>
  </g>
  <g text-anchor="middle">
    <rect x="580" y="600" width="170" height="100" rx="16" fill="#0e1012" stroke="#5FB0B7" stroke-width="4"/>
    <text x="665" y="645" fill="#5FB0B7" font-size="30" font-weight="800">PE2</text>
    <text x="665" y="678" fill="#5FB0B7" font-size="20" font-weight="700">CARRYING</text>
    <text x="665" y="565" fill="#5FB0B7" font-size="19" font-weight="600">redundant path = zero impact</text>
  </g>
  <line x1="235" y1="700" x2="290" y2="905" stroke="#E08A3C" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="320" y1="700" x2="600" y2="905" stroke="#E08A3C" stroke-width="3" stroke-dasharray="6 8" opacity="0.45"/>
  <line x1="665" y1="700" x2="610" y2="905" stroke="#5FB0B7" stroke-width="7" marker-end="url(#arrow)" filter="url(#glow)"/>
  <line x1="580" y1="700" x2="300" y2="905" stroke="#5FB0B7" stroke-width="7" marker-end="url(#arrow)" filter="url(#glow)"/>
  <g text-anchor="middle">
    <circle cx="285" cy="950" r="50" fill="#0e1012" stroke="#5FB0B7" stroke-width="3"/>
    <text x="285" y="960" fill="#EDEAE3" font-size="26" font-weight="700">CE1</text>
    <circle cx="615" cy="950" r="50" fill="#0e1012" stroke="#5FB0B7" stroke-width="3"/>
    <text x="615" y="960" fill="#EDEAE3" font-size="26" font-weight="700">CE2</text>
    <text x="450" y="1035" fill="#9aa0a8" font-size="22" font-weight="600">customers — traffic never stops</text>
  </g>
  <rect x="60" y="1075" width="780" height="100" rx="16" fill="#0e1012" stroke="#5FB0B7" stroke-width="2"/>
  <text x="85" y="1118" fill="#9aa0a8" font-size="20" font-family="Consolas, monospace">$ ping ce1 -> ce2  (non-stop, during reboot)</text>
  <text x="85" y="1155" fill="#5FB0B7" font-size="27" font-weight="700" font-family="Consolas, monospace">0% packet loss — proven, not promised</text>
</svg>
