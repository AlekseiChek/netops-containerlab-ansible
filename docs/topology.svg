<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="620" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F2A3F">netops-lab — redundant 2-site IS-IS / iBGP fabric</text>

  <!-- tier labels -->
  <g font-size="11" fill="#7A8794">
    <text x="14" y="138">SITE-A</text>
    <text x="14" y="248">CORE (P)</text>
    <text x="14" y="358">RR</text>
    <text x="14" y="468">SITE-B</text>
  </g>

  <!-- LINKS first -->
  <!-- eBGP (green) -->
  <g stroke="#27AE60" stroke-width="2" fill="none">
    <line x1="360" y1="42" x2="250" y2="132"/>
    <line x1="360" y1="42" x2="470" y2="132"/>
    <line x1="360" y1="552" x2="250" y2="462"/>
    <line x1="360" y1="552" x2="470" y2="462"/>
  </g>
  <!-- IS-IS L2 (blue) -->
  <g stroke="#2D9CDB" stroke-width="2" fill="none">
    <!-- site-A PEs to core -->
    <line x1="250" y1="132" x2="250" y2="242"/>
    <line x1="250" y1="132" x2="470" y2="242"/>
    <line x1="470" y1="132" x2="470" y2="242"/>
    <line x1="470" y1="132" x2="250" y2="242"/>
    <!-- p1-p2 single core link -->
    <line x1="305" y1="242" x2="415" y2="242"/>
    <!-- RRs to core -->
    <line x1="250" y1="352" x2="250" y2="242"/>
    <line x1="250" y1="352" x2="470" y2="242"/>
    <line x1="470" y1="352" x2="470" y2="242"/>
    <line x1="470" y1="352" x2="250" y2="242"/>
    <!-- site-B PEs to core: same-side routed AROUND the RRs, cross-side via center gap -->
    <polyline points="250,462 125,462 125,242 250,242"/>
    <line x1="250" y1="462" x2="470" y2="242"/>
    <polyline points="470,462 595,462 595,242 470,242"/>
    <line x1="470" y1="462" x2="250" y2="242"/>
  </g>
  <!-- iBGP RR <-> RR (dashed) -->
  <line x1="305" y1="352" x2="415" y2="352" stroke="#8A98A6" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- NODES -->
  <g font-size="12" font-weight="bold" fill="#0F2A3F">
    <!-- ce1 -->
    <rect x="305" y="22" width="110" height="40" rx="7" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/>
    <text x="360" y="40" text-anchor="middle">ce1</text>
    <text x="360" y="54" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">AS65001 · 198.51.100.0/24</text>
    <!-- pe1 / pe2 -->
    <rect x="195" y="112" width="110" height="40" rx="7" fill="#EFF3F7" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="250" y="130" text-anchor="middle">pe1</text>
    <text x="250" y="144" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.1</text>
    <rect x="415" y="112" width="110" height="40" rx="7" fill="#EFF3F7" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="470" y="130" text-anchor="middle">pe2</text>
    <text x="470" y="144" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.2</text>
    <!-- p1 / p2 -->
    <rect x="195" y="222" width="110" height="40" rx="7" fill="#E7ECF1" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="250" y="240" text-anchor="middle">p1</text>
    <text x="250" y="254" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.11</text>
    <rect x="415" y="222" width="110" height="40" rx="7" fill="#E7ECF1" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="470" y="240" text-anchor="middle">p2</text>
    <text x="470" y="254" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.12</text>
    <!-- rr1 / rr2 -->
    <rect x="195" y="332" width="110" height="40" rx="7" fill="#FBF1DA" stroke="#E0A526" stroke-width="1.5"/>
    <text x="250" y="350" text-anchor="middle">rr1 (RR)</text>
    <text x="250" y="364" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo .101 · cl 1.1.1.1</text>
    <rect x="415" y="332" width="110" height="40" rx="7" fill="#FBF1DA" stroke="#E0A526" stroke-width="1.5"/>
    <text x="470" y="350" text-anchor="middle">rr2 (RR)</text>
    <text x="470" y="364" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo .102 · cl 2.2.2.2</text>
    <!-- pe3 / pe4 -->
    <rect x="195" y="442" width="110" height="40" rx="7" fill="#EFF3F7" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="250" y="460" text-anchor="middle">pe3</text>
    <text x="250" y="474" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.3</text>
    <rect x="415" y="442" width="110" height="40" rx="7" fill="#EFF3F7" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="470" y="460" text-anchor="middle">pe4</text>
    <text x="470" y="474" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.4</text>
    <!-- ce2 -->
    <rect x="305" y="532" width="110" height="40" rx="7" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/>
    <text x="360" y="550" text-anchor="middle">ce2</text>
    <text x="360" y="564" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">AS65002 · 203.0.113.0/24</text>
  </g>

  <!-- legend -->
  <g font-size="10.5" fill="#4F5963">
    <line x1="120" y1="598" x2="150" y2="598" stroke="#27AE60" stroke-width="2"/>
    <text x="156" y="602">eBGP (CE dual-homed: ce1→pe1/pe2, ce2→pe3/pe4)</text>
    <line x1="470" y1="598" x2="500" y2="598" stroke="#2D9CDB" stroke-width="2"/>
    <text x="506" y="602">IS-IS L2 (each PE/RR → both P)</text>
  </g>
</svg>
